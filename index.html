<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siren Rush</title>
<style>
*{box-sizing:border-box;user-select:none}html,body{margin:0;height:100%;overflow:hidden;background:#172033;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;inset:0;z-index:2;pointer-events:none;color:#fff}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px}.pill{background:#3b2b59;border-radius:24px;padding:8px 14px;font-weight:bold}.fuel{display:flex;gap:8px;align-items:center;min-width:190px}.fuelbar{height:12px;width:100px;background:#211832;border-radius:8px;overflow:hidden;border:1px solid #ffffff66}.fuelbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5252,#71f28b);transition:width .15s}.zone{text-align:center;margin-top:8px;font-size:14px;letter-spacing:3px;font-weight:bold;text-shadow:0 2px 5px #000}.help{position:absolute;bottom:78px;width:100%;text-align:center;font-size:12px;font-weight:bold;letter-spacing:1px;color:#fffc}.controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:230px;height:42px;border-radius:24px;background:#ffffff38;border:1px solid #fff8;pointer-events:auto;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:24px}.knob{position:absolute;left:100px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0008}.modal{display:none;position:fixed;inset:0;z-index:4;background:#120e24dd;color:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center}.modal h1{font-size:38px;margin:0 0 8px}.modal p{margin:5px}.modal button{margin-top:20px;border:0;border-radius:22px;padding:12px 32px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><div class="pill">★ <span id="coins">0</span></div><div class="pill fuel">⛽ FUEL <div class="fuelbar"><i id="fuelbar"></i></div><span id="fuel">100</span></div><div class="pill" id="distance">0m</div></div><div class="zone" id="zone">TWILIGHT CYBER</div><div class="help">A/D OR ←/→ STEER · W/↑ JUMP · S/↓ SLIDE · COLLECT GREEN FUEL</div><div class="controls" id="controls"><span>‹</span><b class="knob" id="knob"></b><span>›</span></div></div>
<div class="modal" id="modal"><h1 id="reason">OUT OF FUEL</h1><p id="final"></p><button id="restart">PLAY AGAIN</button></div>
<script>
(()=>{
const c=document.querySelector('#game'),x=c.getContext('2d');let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
const zones=[['TWILIGHT CYBER','#172033','#536b87','#25352d','#20262d'],['MINT RAINFALL','#506f73','#9db8b5','#405b4d','#293d3d'],['CANYON DUSK','#76514a','#d19a7e','#65422d','#3d2b24'],['DIRT TRACK','#7d694e','#c7a477','#59402a','#35271b'],['GRASS TRACK','#4c7590','#a7c7d2','#315a35','#394b3b']];
let distance=0,fuel=100,coins=0,lane=0,target=0,jump=0,jumpV=0,slide=0,over=false,last=performance.now(),spawn=0,items=[];
const lanes=[-.65,0,.65],fuelbar=document.querySelector('#fuelbar'),fueltext=document.querySelector('#fuel'),knob=document.querySelector('#knob');
function steer(v){target=Math.max(-1,Math.min(1,v));knob.style.transform=`translateX(${target*80}px)`}function jumpCar(){if(!jump&&!slide){jump=1;jumpV=570}}function slideCar(){if(!jump&&!slide)slide=.55}
addEventListener('keydown',e=>{if('adADArrowLeftArrowRightwsWSArrowUpArrowDown'.includes(e.key))e.preventDefault();if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft')steer(target-.45);if(e.key==='d'||e.key==='D'||e.key==='ArrowRight')steer(target+.45);if(e.key==='w'||e.key==='W'||e.key==='ArrowUp')jumpCar();if(e.key==='s'||e.key==='S'||e.key==='ArrowDown')slideCar()});
let dragging=false,startY=0;const controls=document.querySelector('#controls');controls.onpointerdown=e=>{dragging=true;startY=e.clientY;controls.setPointerCapture(e.pointerId);setPointer(e.clientX)};controls.onpointermove=e=>{if(dragging)setPointer(e.clientX)};controls.onpointerup=e=>{if(e.clientY-startY<-35)jumpCar();if(e.clientY-startY>35)slideCar();dragging=false};function setPointer(px){const r=controls.getBoundingClientRect();steer((Math.max(0,Math.min(r.width,px-r.left))/r.width)*2-1)}
function project(z,l=0,y=0){let s=270/(z+1),h=H*.44;return {x:W/2+l*s*340,y:h+(150-y)*s,s}}function poly(points,fill){x.fillStyle=fill;x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill()}
function car(px,py,s,traffic=false,color='#4e87c5',low=false){let w=(traffic?88:126)*s,h=(traffic?64:78)*s;x.save();x.translate(px,py);if(low)x.scale(1,.65);x.fillStyle='#0008';x.beginPath();x.ellipse(0,5*s,w*.58,10*s,0,0,7);x.fill();let g=x.createLinearGradient(-w/2,-h,w/2,0);g.addColorStop(0,color);g.addColorStop(.45,'#edf4fa');g.addColorStop(.62,color);g.addColorStop(1,'#273747');x.fillStyle=g;poly([[-w/2,0],[-w*.47,-h*.46],[-w*.28,-h*.75],[-w*.15,-h], [w*.16,-h],[w*.31,-h*.72],[w*.48,-h*.46],[w/2,0]],g);x.fillStyle='#172633';poly([[-w*.27,-h*.82],[w*.18,-h*.82],[w*.29,-h*.55],[-w*.32,-h*.55]],'#172633');x.strokeStyle='#bcd7e877';x.lineWidth=2*s;x.stroke();x.fillStyle='#10151b';for(const q of [-.38,.38]){x.beginPath();x.ellipse(w*q,-2*s,11*s,8*s,0,0,7);x.fill();x.fillStyle='#aeb9c0';x.beginPath();x.arc(w*q,-2*s,3*s,0,7);x.fill();x.fillStyle='#10151b'}x.shadowColor='#ff315b';x.shadowBlur=10;x.fillStyle='#ff315b';x.fillRect(-w*.4,-h*.3,22*s,7*s);x.fillRect(w*.4-22*s,-h*.3,22*s,7*s);x.shadowBlur=0;x.fillStyle='#13202d';x.beginPath();x.arc(0,-h*.35,9*s,0,7);x.fill();x.fillStyle='#fff';x.font=`bold ${7*s}px Arial`;x.textAlign='center';x.fillText('SR',0,-h*.35);x.restore()}
function item(o){let p=project(o.z,o.l,0),s=p.s,sz=30*s;x.save();if(o.type==='fuel'){x.shadowColor='#39ee70';x.shadowBlur=14;x.fillStyle='#39d86b';x.fillRect(p.x-sz*.5,p.y-sz*1.4,sz,sz*1.15);x.fillStyle='#fff';x.font=`bold ${14*s}px Arial`;x.textAlign='center';x.fillText('F',p.x,p.y-sz*.65)}else if(o.type==='coin'){x.fillStyle='#ffe640';x.shadowColor='#ffe640';x.shadowBlur=10;x.beginPath();x.arc(p.x,p.y-sz*.7,sz*.5,0,7);x.fill()}else{ x.fillStyle=o.type==='overhead'?'#f0a62a':'#d34838';if(o.type==='overhead')x.fillRect(p.x-sz*1.5,p.y-sz*2,sz*3,sz*.5);else poly([[p.x,p.y-sz*1.5],[p.x+sz*.7,p.y],[p.x-sz*.7,p.y]],x.fillStyle)}x.restore()}
function reset(){distance=0;fuel=100;coins=0;lane=target=0;jump=jumpV=slide=0;items=[];spawn=0;over=false;document.querySelector('#modal').style.display='none';last=performance.now();steer(0)}document.querySelector('#restart').onclick=reset;
function end(reason){over=true;document.querySelector('#reason').textContent=reason;document.querySelector('#final').textContent=`Distance: ${Math.floor(distance)}m · Coins: ${coins}`;document.querySelector('#modal').style.display='flex'}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!over){distance+=18*dt;fuel-=2.5*dt;if(fuel<=0){fuel=0;end('OUT OF FUEL')}lane+=(target-lane)*Math.min(1,dt*12);if(jump){jump+=jumpV*dt;jumpV-=1600*dt;if(jump<=0){jump=0;jumpV=0}}if(slide){slide-=dt;if(slide<0)slide=0}spawn+=dt;if(spawn>1.1){spawn=0;let bad=lanes[Math.floor(Math.random()*3)],kind=Math.random()<.3?'overhead':'cone';items.push({l:bad,z:1800,type:kind,hit:0});lanes.forEach(l=>{if(l!==bad&&Math.random()<.8)items.push({l,z:1800,type:Math.random()<.2?'fuel':'coin'})})}items.forEach(o=>o.z-=470*dt);for(let i=items.length-1;i>=0;i--){let o=items[i];if(o.z<245&&o.z>130&&Math.abs(o.l-lane)<.3){if(o.type==='fuel'){fuel=Math.min(100,fuel+35);items.splice(i,1)}else if(o.type==='coin'){coins++;items.splice(i,1)}else if(!o.hit){let clear=o.type==='overhead'?slide>0:jump>50;if(clear)o.hit=1;else end('CRASHED!')}}if(o.z<50)items.splice(i,1)}let z=zones[Math.floor(distance/600)%zones.length];document.querySelector('#zone').textContent=z[0];fuelbar.style.width=fuel+'%';fueltext.textContent=Math.ceil(fuel);document.querySelector('#coins').textContent=coins;document.querySelector('#distance').textContent=Math.floor(distance)+'m';x.fillStyle=z[1];x.fillRect(0,0,W,H);let grd=x.createLinearGradient(0,0,0,H);grd.addColorStop(.42,z[2]);grd.addColorStop(1,z[3]);x.fillStyle=grd;x.fillRect(0,0,W,H);for(let zz=1800;zz>70;zz-=25){let a=project(zz),b=project(zz-25),wa=a.s*340,wb=b.s*340;poly([[a.x-wa,a.y],[a.x+wa,a.y],[b.x+wb,b.y],[b.x-wb,b.y]],z[4]);if(Math.floor(zz/75)%2===0){x.fillStyle='#e9e8ca99';x.fillRect(a.x-a.s*115,a.y,Math.max(2,a.s*4),Math.max(2,b.y-a.y));x.fillRect(a.x+a.s*115,a.y,Math.max(2,a.s*4),Math.max(2,b.y-a.y))}}items.sort((a,b)=>b.z-a.z).forEach(o=>item(o));let p=project(210,lane,jump);car(p.x,p.y,p.s,false,'#5f9cdb',slide>0)}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();
</script></body></html>
